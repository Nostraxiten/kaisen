name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
      - name: Clippy
        run: cargo clippy -- -D warnings || true
      - name: Smoke test
        run: |
          cargo run -- --version
          cargo run -- --help | head -1
          cargo run -- --vuln-list | tail -3
          cargo run -- dns A example.com @1.1.1.1 +short || true
