name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: clippy, rustfmt

      - name: Formato (cargo fmt)
        run: cargo fmt --check

      - name: Build (debug)
        run: cargo build --verbose

      - name: Build (release profile)
        run: cargo build --release --verbose

      - name: Tests
        run: cargo test --verbose

      - name: Clippy (errores estrictos)
        run: cargo clippy -- -D warnings

      - name: Smoke test
        run: |
          cargo run -- --version
          cargo run -- --help | head -1
          cargo run -- --vuln-list | tail -3
          cargo run -- dns A example.com @1.1.1.1 +short || true
