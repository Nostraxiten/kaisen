name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            name: kaisen-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            name: kaisen-linux-aarch64
          - os: ubuntu-latest
            target: aarch64-linux-android
            name: kaisen-android-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: kaisen-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: kaisen-macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation helper
        if: runner.os == 'Linux'
        run: cargo install cross --locked || true

      - name: Build (native)
        if: runner.os == 'macOS'
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross)
        if: runner.os == 'Linux'
        run: |
          if command -v cross >/dev/null 2>&1; then
            cross build --release --target ${{ matrix.target }}
          else
            rustup target add ${{ matrix.target }}
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          BIN=target/${{ matrix.target }}/release/kaisen
          mkdir -p dist
          cp "$BIN" "dist/${{ matrix.name }}"
          ( cd dist && tar -czf "${{ matrix.name }}.tar.gz" "${{ matrix.name }}" )

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.tar.gz
          generate_release_notes: true
