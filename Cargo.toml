[package]
name = "kaisen"
version = "1.5.0"
edition = "2021"
rust-version = "1.78"
authors = ["Kaisen contributors"]
description = "Kaisen — a fast nmap + dig hybrid network scanner that works without root"
license = "MIT"
repository = "https://github.com/nostraxiten/kaisen"
readme = "README.md"
keywords = ["nmap", "dig", "portscanner", "dns", "security"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "kaisen"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util", "sync", "process"] }
futures = "0.3"
# Used only to set SO_LINGER=0 (RST-on-close) on scan sockets so a big -sV
# sweep doesn't leave zombie conntrack entries that stall the whole link.
# Already present transitively via tokio/mio; pinned here as a direct dep.
socket2 = "0.6"

# Default release profile — used when building from source (install.sh, cargo build --release).
# Thin LTO + 4 codegen-units compile ~50% faster than fat LTO on slow hardware (ARM/Termux)
# while retaining >95% of the runtime optimisations. The binary is a few KB larger, which
# is invisible after `strip = true`.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true

# CI release profile — used only by release.yml (`cargo build --profile release-lto`).
# Fat LTO + 1 codegen-unit produces the smallest, fastest binary for the official
# prebuilt assets that users download. CI runners have ample CPU/RAM so the longer
# compile time (2–4× vs thin LTO) is acceptable.
[profile.release-lto]
inherits = "release"
lto = true
codegen-units = 1

